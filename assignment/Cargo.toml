[package]
name = "assignment"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
diesel = { version = "2", features = ["postgres", "r2d2"] }
redis = { version = "0.28", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
anyhow = "1"
